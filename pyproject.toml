[tool.uv.workspace]
members = ["packages/*"]

[tool.uv]
# Install a version only after it is 7 days old, so a compromised release has
# time to be found and removed first.
exclude-newer = "7 days"
# marimo[recommended] asks for sqlglot[c], whose compiled part ships as source
# only and fails to build on Linux. Plain sqlglot is pure Python.
override-dependencies = ["sqlglot"]

[tool.uv.sources]
trrack = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "marimo[recommended]>=0.23.14",
    "ruff>=0.15.9",
    "ty",
    "watchfiles>=0.24.0",
    "wigglystuff>=0.5.14",
]
docs = [
    "mkdocstrings-python>=2.0.9",
    "zensical>=0.0.67",
]

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["packages/trrack/src", "packages/trrack-widget/src"]
# The code blocks in the docs align their trailing comments by hand, and the
# formatter removes that alignment.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D203",    # one-blank-line-before-class (conflicts with D211)
    "D213",    # multi-line-summary-second-line (conflicts with D212)
    "COM812",  # trailing comma (formatter handles this)
    "ISC001",  # implicit string concat (formatter handles this)
    "FBT001", "FBT002",  # boolean positional args — acceptable in this API
    "ANN401",  # allow typing.Any where the snapshot dicts need it
    "CPY001",  # no copyright header per file; the LICENSE file covers the repo
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = ["D", "S101", "ANN", "SLF001", "PLR2004", "INP001", "PLC0415"]
"trrack-widget-demo.py" = ["ALL"]
# The examples folder is on marimo's path, not a package.
"examples/*.py" = ["INP001"]
# marimo owns the layout of its notebook files.
"examples/*/*.py" = ["ALL"]

# Lets the example notebooks import the widgets they share.
[tool.marimo.runtime]
pythonpath = ["examples"]

[tool.pytest.ini_options]
testpaths = ["packages/trrack/tests", "packages/trrack-widget/tests"]
markers = [
    "unit: fast isolated tests",
    "integration: cross-package tests",
]
