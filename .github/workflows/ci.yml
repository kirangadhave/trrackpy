name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          build-frontend: true
      - run: uv run ruff check --output-format=github packages
      - run: uv run ruff format --check packages

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          build-frontend: true
      - run: uv run ty check packages

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          build-frontend: true
      - name: Run tests
        run: uv run pytest -v
        env:
          UV_PYTHON: ${{ matrix.python-version }}

  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - run: |
          cd packages/trrack-widget
          pnpm install
          pnpm run lint
          pnpm run format:check
          pnpm run typecheck

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Build live notebooks
        run: docs/live/build.sh
      - run: uv run --only-group docs zensical build --strict
      - name: Check the embedded notebooks
        run: |
          test -f site/live/trrackable/index.html
          test -f site/live/persisted/index.html
