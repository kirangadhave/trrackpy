name: Docs

on:
  workflow_dispatch:
  # The release workflow calls this after both packages publish.
  workflow_call:

permissions:
  contents: read

# One deployment at a time. A newer run waits for a running one to finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      # The API reference reads the Python source only, so the build does not
      # install the packages or bundle the frontend.
      - run: uv run --only-group docs zensical build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
