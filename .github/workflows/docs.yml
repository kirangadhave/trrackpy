name: Docs

on:
  workflow_dispatch:
  # The release workflow calls this after both packages publish.
  workflow_call:

permissions:
  contents: read

# One deployment at a time. A newer run waits for a running one to finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # The live notebooks run in the browser on wheels built from this commit.
      # The widget wheel needs the compiled frontend, so the script bundles it.
      - name: Build live notebooks
        run: docs/live/build.sh
      # `--strict` fails the build on a broken link.
      - run: uv run --only-group docs zensical build --strict
      # The strict build does not check the address of an embedded notebook.
      - name: Check the embedded notebooks
        run: |
          test -f site/live/trrackable/index.html
          test -f site/live/persisted/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
